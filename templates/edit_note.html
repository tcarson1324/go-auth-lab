<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note - Go Auth Lab</title>
</head>
<body>
    <h1>Edit Note</h1>

    <form action="/notes/edit" method="POST">
        <input
            type="hidden"
            name="note_id"
            value="{{.Note.ID}}"
        >

        <input
            type="hidden"
            name="csrf_token"
            value="{{.CSRFToken}}"
        >

        <textarea name="content" rows="6" cols="50">{{.Note.Content}}</textarea>

        <br>
        <button type="submit">Save Changes</button>
    </form>

    <a href="/profile">Cancel</a>
</body>
</html>
